name: Visual QA
on:
  workflow_dispatch:
  push:
    paths:
      - 'design-system/**'
      - 'prototype/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.mjs'
      - '.github/workflows/visual-qa.yml'
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:qa
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-qa
          path: |
            playwright-report/
            qa-results/
