<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vaporwave · System 1987</title><style>:root{color-scheme:dark;--pink:#ff71ce;--cyan:#01cdfe;--canvas:#0d0221;--mint:#05ffa1;--violet:#b967ff;--sun:#fffb96;--text:#f8efff;--muted:#c7b5df;--panel:#20113bdb;--radius:4px;--gap:16px;--mono:ui-monospace,Consolas,monospace}
*{box-sizing:border-box}body{margin:0;background-color:var(--canvas);background-image:repeating-linear-gradient(0deg,#b967ff16 0 1px,transparent 1px 32px),repeating-linear-gradient(90deg,#01cdfe16 0 1px,transparent 1px 32px),repeating-linear-gradient(0deg,#ffffff09 0 1px,transparent 1px 4px);color:var(--text);font:13px/1.6 var(--mono)}.shell{max-width:1200px;margin:auto;padding:24px;display:grid;grid-template-columns:180px minmax(0,1fr);gap:var(--gap)}.panel{background:var(--panel);border:1px solid var(--violet);border-radius:var(--radius);padding:16px;box-shadow:0 12px 32px #0006;backdrop-filter:blur(12px)}nav{display:flex;flex-direction:column;gap:8px}nav button{text-align:left}h1{font-size:clamp(28px,5vw,52px);line-height:1.15;margin:12px 0;text-shadow:2px 0 var(--pink),-2px 0 var(--cyan);color:var(--text)}h2{font-size:24px;margin:0 0 16px}small,.muted{color:var(--muted)}.label{font-size:12px;letter-spacing:.24em;color:var(--cyan)}.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap)}.span4{grid-column:span 4}.span8{grid-column:span 8}.span12{grid-column:span 12}.metric{font-size:30px;color:var(--pink)}button,input,select{font:inherit;color:var(--text);border:1px solid var(--violet);border-radius:var(--radius);background:#160a2c;min-height:40px;padding:8px 12px}button{cursor:pointer;border-color:var(--pink);color:var(--pink);transition:transform .18s,box-shadow .65s}button:hover:not(:disabled){box-shadow:2px 0 var(--pink),-2px 0 var(--cyan);transform:translateY(-1px)}button:active:not(:disabled){transform:translate(2px,1px)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--sun);outline-offset:3px}button:disabled{color:var(--muted);border-color:#665478;cursor:not-allowed}input[aria-invalid=true]{border-color:var(--pink)}.error{color:var(--pink)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.bars{display:flex;height:110px;align-items:end;gap:8px}.bars i{flex:1;background:linear-gradient(var(--pink),var(--violet));border:1px solid var(--cyan);min-width:0}.status{color:var(--mint);border-top:1px solid var(--violet);padding-top:8px;margin-top:16px}.sunset{height:96px;position:relative;overflow:hidden;background:linear-gradient(#241049,#0d0221)}.sunset:before{content:"";position:absolute;width:100px;height:100px;left:calc(50% - 50px);top:15px;border-radius:50%;background:repeating-linear-gradient(0deg,transparent 0 7px,#20113b 7px 9px),linear-gradient(var(--sun),var(--pink))}.swatch{display:inline-block;width:28px;height:28px;border:1px solid var(--text);vertical-align:middle}.form{display:grid;gap:8px}a{color:var(--cyan)}@media(max-width:768px){.shell{grid-template-columns:1fr;padding:12px}nav{flex-direction:row;flex-wrap:wrap}.span4,.span8{grid-column:span 12}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}button:hover,button:active{transform:none!important}}</style><body><div class="shell"><aside class="panel"><div class="label">SYS / 1987</div><nav aria-label="示例导航"><button data-nav="工作台">◇ 工作台</button><button data-nav="资源">◇ 资源</button><button data-nav="设置">◇ 设置</button></nav><p class="muted">独立风格预览</p></aside><main><div class="label">DESIGN SYSTEM / 01</div><h1>SYSTEM 1987</h1><p class="muted">霓虹复古 · 示例仪表盘 · 固定演示数据</p><div class="grid"><section class="panel span4">信号强度<div class="metric">92%</div></section><section class="panel span4">资源<div class="metric">256</div></section><section class="panel span4">任务<div class="metric">12</div></section><section class="panel span8"><h2>活动趋势</h2><div class="bars" role="img" aria-label="示例六期趋势 24、45、33、67、52、90"><i style="height:24%"></i><i style="height:45%"></i><i style="height:33%"></i><i style="height:67%"></i><i style="height:52%"></i><i style="height:90%"></i></div></section><section class="panel span4"><h2>视觉素材</h2><div class="sunset" role="img" aria-label="CSS 几何条纹落日"></div></section><section class="panel span12"><h2>组件与状态</h2><div class="row"><button id="action">连接系统</button><button disabled>不可用</button><button id="load">加载示例</button></div><p id="feedback" role="status" class="status">SYSTEM ONLINE</p><form class="form" id="form" novalidate><label for="name">资源名称</label><input id="name" required aria-describedby="error" placeholder="请输入名称"><p id="error" class="error" role="alert"></p><label for="type">资源类型</label><select id="type"><option>色彩</option><option>背景</option><option>组件</option></select><button type="submit">保存示例</button></form></section><section class="panel span12"><h2>色板</h2><div class="row"><span><i class="swatch" style="background:#ff71ce"></i> pink #ff71ce</span><span><i class="swatch" style="background:#01cdfe"></i> cyan #01cdfe</span><span><i class="swatch" style="background:#0d0221"></i> midnight #0d0221</span><span><i class="swatch" style="background:#05ffa1"></i> mint #05ffa1</span><span><i class="swatch" style="background:#b967ff"></i> violet #b967ff</span><span><i class="swatch" style="background:#fffb96"></i> sunlight #fffb96</span></div></section></div></main></div><script>const f=document.getElementById('feedback');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>f.textContent='导航示例：'+b.dataset.nav);document.getElementById('action').onclick=()=>f.textContent='CONNECTION ESTABLISHED';const l=document.getElementById('load');l.onclick=()=>{l.disabled=true;l.setAttribute('aria-busy','true');f.textContent='LOADING…';setTimeout(()=>{l.disabled=false;l.removeAttribute('aria-busy');f.textContent='COMPLETE'},700)};document.getElementById('form').onsubmit=e=>{e.preventDefault();const n=document.getElementById('name'),bad=!n.value.trim();n.setAttribute('aria-invalid',String(bad));document.getElementById('error').textContent=bad?'请输入资源名称':'';if(bad)n.focus();else f.textContent='示例保存：'+n.value.trim()};</script></body></html>
