<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI Design Studio · Composer V2</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#252839;font:14px system-ui,sans-serif}header,aside,footer{background:white;padding:14px;border:1px solid #e2e4eb}header{display:flex;gap:8px;flex-wrap:wrap;align-items:center}header strong{margin-right:auto}button,select,input{font:inherit;padding:8px;border:1px solid #d7dbe4;background:white;border-radius:6px;color:inherit}button{cursor:pointer}button:disabled{opacity:.45}main{display:grid;grid-template-columns:220px minmax(0,1fr) 270px;min-height:70vh}.stage{padding:12px;min-width:0}.view{overflow:auto;background:#e5e7eb;padding:10px}.frames{display:flex;gap:10px;width:max-content}iframe{height:650px;border:0;background:white}nav button{display:block;width:100%;text-align:left;margin:3px 0;border:0}.active{background:#e9e8ff}label{display:block;margin:10px 0 4px}aside select,aside input[type=text]{width:100%}textarea{width:100%;height:160px}small{color:#626777}.row{display:flex;gap:6px;flex-wrap:wrap}h3{margin:12px 0}#diagnostics{font-size:12px;color:#805620}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #6366f1;outline-offset:2px}@media(max-width:900px){main{grid-template-columns:180px minmax(0,1fr)}aside:last-child{grid-column:1/-1}}@media(max-width:550px){main{display:block}nav button{display:inline-block;width:auto}} .library{padding:16px;border-top:1px solid #e2e4eb;background:#fff}.style-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:12px 0}.style-card{border:1px solid #e2e4eb;border-radius:10px;padding:12px;display:grid;gap:8px}.style-card small{display:block}.swatches{display:flex;gap:4px}.swatches span{height:25px;flex:1;border:1px solid #8884;border-radius:4px}.library iframe{width:100%;height:520px;border:1px solid #ddd}.library input[type=text]{max-width:260px}</style></head><body><header><strong>UI Design Studio / Composer V2</strong><button id="undo">撤销</button><button id="redo">重做</button><select id="device" aria-label="设备"><option value="fit">适应窗口</option><option value="1440">1440</option><option value="768">768</option><option value="375">375</option></select><button id="compare">A/B 对比</button><button id="save">保存</button><button id="html">导出 HTML</button></header><main><aside><label for="preset">整体预设</label><select id="preset"></select><button id="apply">套用（保留锁定）</button><label for="search">搜索维度</label><input id="search" type="text"><nav id="dims" aria-label="设计维度"></nav></aside><section class="stage"><p id="status" role="status">加载资源目录…</p><small>固定业务数据 · 实际 iframe · 候选资源不等于正式发布</small><div class="view" id="view"><div class="frames" id="frames"><iframe id="preview" sandbox="allow-scripts" title="当前预览"></iframe></div></div></section><aside><h3 id="title">设计维度</h3><label for="option">资源选项</label><select id="option"></select><label><input type="checkbox" id="lock"> 锁定维度</label><button id="reset">单维重置</button><h3>参数覆盖</h3><label for="radius">圆角 0–40px</label><input id="radius" type="number" min="0" max="40" step="1" placeholder="默认"><label for="primary">主色 HEX</label><input id="primary" type="text" placeholder="默认"><button id="overrides">应用参数</button><h3>方案</h3><label for="name">名称</label><input id="name" type="text" maxlength="80"><label for="saved">本地快照</label><select id="saved"></select><div class="row"><button id="load">加载</button><button id="remove">删除</button></div><h3>诊断</h3><div id="diagnostics" role="status"></div></aside></main><section class="library"><h2>完整风格方案库 · 30 套候选</h2><div class="row"><input id="styleSearch" type="text" aria-label="搜索风格" placeholder="中英文名称 / 标签"><select id="styleTheme" aria-label="筛选主题"><option value="">全部主题</option><option value="light">浅色</option><option value="dark">深色</option></select><label><input type="checkbox" id="favoriteOnly"> 仅收藏</label></div><p id="styleCount" role="status"></p><div class="style-cards" id="styleCards"></div><details open><summary id="libraryTitle">独立风格预览（选择卡片）</summary><iframe id="libraryPreview" sandbox="allow-scripts" title="独立风格预览"></iframe><label for="libraryDoc">自动生成规范</label><textarea id="libraryDoc" readonly></textarea></details></section><footer><div class="row"><button id="json">JSON</button><button id="tokens">Tokens</button><button id="css">CSS</button><button id="prompt">复制提示词</button><button id="bundle">设计包 JSON</button><button id="markdown">导出风格 Markdown</button><button id="import">导入 V1/V2</button><input hidden type="file" id="file" accept=".json,application/json"></div><label for="output">解析配置与来源</label><textarea id="output" readonly></textarea><details open><summary>13 节自动生成风格规范</summary><label for="styleDoc">当前方案风格文档</label><textarea id="styleDoc" readonly style="height:320px"></textarea></details></footer><script type="module" src="./app.mjs"></script></body></html>
